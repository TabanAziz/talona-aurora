[project]
name = "aurora-backend"
version = "0.1.0"
description = "Aurora backend: ingest site messages, keep the record, flag problems before work starts"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
    "qrcode[pil]>=8.2",
    "pypdfium2==5.7.0",
    "pillow>=10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["app"]
pythonpath = ["."]
