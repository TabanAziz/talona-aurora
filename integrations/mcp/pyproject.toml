[project]
name = "aurora-mcp"
version = "0.1.0"
description = "Read-only MCP server for the Aurora site state and the start check"
requires-python = ">=3.11,<3.14"
dependencies = ["mcp>=2.3,<3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
